l_english:
 origin_advto_tier_1: "Tier I Technology"
 origin_advto_tier_1_desc: "A cosmic disaster tore this empire from its native universe and cast it into an unfamiliar reality. Its people survived the crossing with their civilization and knowledge through Technology Tier 1 intact. Stranded beneath unknown stars, they must now build a new future in this universe."
 origin_advto_tier_1_effects: "Starts with all eligible §YTier 1§! technologies researched.\n\nDLC and empire-specific technologies are granted only when applicable. Repeatable and special reward technologies are excluded."

