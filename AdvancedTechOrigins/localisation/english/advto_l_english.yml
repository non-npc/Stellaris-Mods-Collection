 START_SCREEN_ADVTO_TIER_1: "There was no warning.\n\nA cosmic disaster engulfed our civilization and tore it from the universe of its birth. When the light finally receded, every familiar constellation had vanished. Our homeworld and our people survived, but the rest of our old reality was gone.\n\nThe crossing left our civilization's knowledge through §HTechnology Tier 1§! intact. We are strangers beneath unknown stars, surrounded by a galaxy whose history is not our own. Whatever force brought us here, survival now demands that we explore this new universe and build a future within it."
